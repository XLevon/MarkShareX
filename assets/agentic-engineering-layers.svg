<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-up" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <path d="M 0,6 L 4,0 L 8,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#0f172a"/>
  <rect width="900" height="620" fill="url(#grid)" opacity="0.6"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-family="Inter,sans-serif" font-size="20" font-weight="700">Agentic Engineering 三层架构</text>
  <text x="450" y="58" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="12">Prompt → Context → Harness 的逐层递进关系</text>

  <!-- ==================== Harness Engineering (Outer Layer) ==================== -->
  <rect x="30" y="75" width="840" height="310" rx="14" fill="rgba(249,115,22,0.06)" stroke="#f97316" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="50" y="100" fill="#f97316" font-family="Inter,sans-serif" font-size="14" font-weight="700">⚙️ Harness Engineering — 执行环境工程</text>
  <text x="50" y="118" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">设计模型外部的 scaffolding：循环 · 工具 · 沙箱 · 重试 · 权限 · 记忆 · 评估</text>

  <!-- Harness component pills -->
  <rect x="50" y="130" width="88" height="22" rx="11" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="0.8"/>
  <text x="94" y="145" text-anchor="middle" fill="#f97316" font-family="Inter,sans-serif" font-size="10">采样循环</text>
  <rect x="148" y="130" width="88" height="22" rx="11" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="0.8"/>
  <text x="192" y="145" text-anchor="middle" fill="#f97316" font-family="Inter,sans-serif" font-size="10">工具系统</text>
  <rect x="246" y="130" width="76" height="22" rx="11" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="0.8"/>
  <text x="284" y="145" text-anchor="middle" fill="#f97316" font-family="Inter,sans-serif" font-size="10">执行编排</text>
  <rect x="332" y="130" width="100" height="22" rx="11" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="0.8"/>
  <text x="382" y="145" text-anchor="middle" fill="#f97316" font-family="Inter,sans-serif" font-size="10">状态与记忆</text>
  <rect x="442" y="130" width="76" height="22" rx="11" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="0.8"/>
  <text x="480" y="145" text-anchor="middle" fill="#f97316" font-family="Inter,sans-serif" font-size="10">权限控制</text>
  <rect x="528" y="130" width="76" height="22" rx="11" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="0.8"/>
  <text x="566" y="145" text-anchor="middle" fill="#f97316" font-family="Inter,sans-serif" font-size="10">评估观测</text>
  <rect x="614" y="130" width="76" height="22" rx="11" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="0.8"/>
  <text x="652" y="145" text-anchor="middle" fill="#f97316" font-family="Inter,sans-serif" font-size="10">错误恢复</text>
  <rect x="700" y="130" width="88" height="22" rx="11" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="0.8"/>
  <text x="744" y="145" text-anchor="middle" fill="#f97316" font-family="Inter,sans-serif" font-size="10">子Agent编排</text>

  <!-- ==================== Context Engineering (Middle Layer) ==================== -->
  <rect x="80" y="165" width="740" height="145" rx="12" fill="rgba(139,92,246,0.08)" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="100" y="188" fill="#a78bfa" font-family="Inter,sans-serif" font-size="13" font-weight="700">📋 Context Engineering — 上下文工程</text>
  <text x="100" y="204" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">在每次推理时策展出最优 token 集合："在正确时机塞入正确信息"</text>

  <!-- Context components -->
  <rect x="100" y="215" width="95" height="20" rx="10" fill="rgba(139,92,246,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="147" y="229" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="10">System Prompt</text>
  <rect x="205" y="215" width="95" height="20" rx="10" fill="rgba(139,92,246,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="252" y="229" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="10">工具定义</text>
  <rect x="310" y="215" width="80" height="20" rx="10" fill="rgba(139,92,246,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="350" y="229" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="10">RAG 检索</text>
  <rect x="400" y="215" width="80" height="20" rx="10" fill="rgba(139,92,246,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="440" y="229" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="10">历史消息</text>
  <rect x="490" y="215" width="80" height="20" rx="10" fill="rgba(139,92,246,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="530" y="229" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="10">长期记忆</text>
  <rect x="580" y="215" width="80" height="20" rx="10" fill="rgba(139,92,246,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="620" y="229" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="10">结构化输出</text>
  <rect x="670" y="215" width="90" height="20" rx="10" fill="rgba(139,92,246,0.15)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="715" y="229" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="10">Compaction</text>

  <!-- ==================== Prompt Engineering (Inner Layer) ==================== -->
  <rect x="175" y="245" width="550" height="52" rx="10" fill="rgba(34,211,238,0.1)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="195" y="266" fill="#22d3ee" font-family="Inter,sans-serif" font-size="13" font-weight="700">💬 Prompt Engineering — 提示工程</text>
  <text x="195" y="284" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">设计单次给模型的指令：角色定位 · 任务分解 · 格式约束 · 少样本示例 · 边界限制</text>

  <!-- ==================== Timeline Section ==================== -->
  <text x="450" y="420" text-anchor="middle" fill="#e2e8f0" font-family="Inter,sans-serif" font-size="14" font-weight="700">演进时间线</text>

  <!-- Timeline line -->
  <line x1="60" y1="448" x2="840" y2="448" stroke="#334155" stroke-width="2"/>

  <!-- 2022 -->
  <circle cx="150" cy="448" r="6" fill="#22d3ee"/>
  <text x="150" y="473" text-anchor="middle" fill="#22d3ee" font-family="Inter,sans-serif" font-size="12" font-weight="700">2022</text>
  <text x="150" y="490" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">Prompt Engineering</text>
  <text x="150" y="504" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="9">ChatGPT · Jasper</text>

  <!-- 2023 -->
  <circle cx="360" cy="448" r="6" fill="#a78bfa"/>
  <text x="360" y="473" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="12" font-weight="700">2023</text>
  <text x="360" y="490" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">+ RAG</text>
  <text x="360" y="504" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="9">LangChain · LlamaIndex</text>

  <!-- 2024 -->
  <circle cx="570" cy="448" r="6" fill="#a78bfa"/>
  <text x="570" y="473" text-anchor="middle" fill="#a78bfa" font-family="Inter,sans-serif" font-size="12" font-weight="700">2024</text>
  <text x="570" y="490" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">Context Engineering</text>
  <text x="570" y="504" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="9">Cursor · Devin · Dify</text>

  <!-- 2025 -->
  <circle cx="780" cy="448" r="8" fill="#f97316"/>
  <text x="780" y="473" text-anchor="middle" fill="#f97316" font-family="Inter,sans-serif" font-size="12" font-weight="700">2025</text>
  <text x="780" y="490" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">Harness Engineering</text>
  <text x="780" y="504" text-anchor="middle" fill="#64748b" font-family="Inter,sans-serif" font-size="9">Claude Code · Cursor · OpenHands</text>

  <!-- Formula box -->
  <rect x="200" y="528" width="500" height="55" rx="10" fill="rgba(249,115,22,0.08)" stroke="#f97316" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="450" y="553" text-anchor="middle" fill="#f97316" font-family="Inter,sans-serif" font-size="14" font-weight="700">核心公式：Agent = Model + Harness</text>
  <text x="450" y="572" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">Prompt 是 Context 的子集，Context 是 Harness 的组成部分</text>

  <!-- Arrow from formula back to harness -->
  <line x1="450" y1="528" x2="450" y2="395" stroke="#f97316" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-up)"/>
</svg>
