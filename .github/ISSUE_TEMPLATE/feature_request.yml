name: 功能建议
description: 建议新功能或改进现有体验
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。较大的功能或架构调整建议先在 Issue 中达成范围共识，再提交实现 PR。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前场景、用户目标和现有痛点，而不只是给出实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、主要交互或 API 形态。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 说明尝试过或考虑过的替代方式。
  - type: textarea
    id: impact
    attributes:
      label: 兼容性与影响
      description: 是否涉及数据库迁移、配置、API、权限、安全或现有部署兼容性？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 我没有在此 Issue 中包含任何凭据、生产数据或未公开漏洞细节。
          required: true
