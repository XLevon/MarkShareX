name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.95.0"
  NODE_VERSION: "22.14.0"

jobs:
  quality-gate:
    name: Release quality gate
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      - name: Cache Cargo data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-quality-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Verify source versions
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          frontend_version="$(python3 -c 'import json; print(json.load(open("frontend/package.json", encoding="utf-8"))["version"])')"
          test "$cargo_version" = "$frontend_version"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v${cargo_version}"
          fi

          echo "Release version: ${cargo_version}"

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Check source and documentation synchronization
        run: python3 scripts/check_doc_sync.py

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check all Rust targets
        run: cargo check --all-targets --locked

      - name: Run Clippy
        run: >-
          cargo clippy --all-targets --all-features --locked --
          -D clippy::correctness
          -D clippy::suspicious
          -A clippy::misnamed_getters

      - name: Run backend tests
        run: cargo test --all-targets --locked --no-fail-fast

  build-frontend:
    name: Build frontend once
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build production frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build -- --outDir "$GITHUB_WORKSPACE/release-input/static/frontend"
          test -f "$GITHUB_WORKSPACE/release-input/static/frontend/index.html"
          test -d "$GITHUB_WORKSPACE/release-input/static/frontend/assets"

      - name: Upload frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: release-input
          if-no-files-found: error
          retention-days: 1

  build-binaries:
    name: Build ${{ matrix.platform }}
    needs:
      - quality-gate
      - build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: marksharex
            archive: tar.gz
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: marksharex
            archive: tar.gz
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            executable: marksharex
            archive: tar.gz
          - platform: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            executable: marksharex
            archive: tar.gz
          - platform: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: marksharex.exe
            archive: zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.target }}"

      - name: Cache Cargo data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}
          key: release-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}

      - name: Download frontend build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: release-input

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package complete release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          python scripts/package_release.py \
            --repository . \
            --version "$version" \
            --platform "${{ matrix.platform }}" \
            --binary "target/${{ matrix.target }}/release/${{ matrix.executable }}" \
            --frontend release-input/static/frontend \
            --archive "${{ matrix.archive }}" \
            --output-dir release-assets

      - name: Smoke-test packaged application
        shell: bash
        run: |
          set -euo pipefail
          archive="$(python -c 'from pathlib import Path; print(next(path for path in Path("release-assets").iterdir() if path.name.endswith((".tar.gz", ".zip"))))')"
          python scripts/smoke_test_release.py \
            --archive "$archive" \
            --timeout 90

      - name: Upload platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download all platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            test -f "release-assets/marksharex-v${version}-${platform}.tar.gz"
            test -f "release-assets/marksharex-v${version}-${platform}.tar.gz.sha256"
          done
          test -f "release-assets/marksharex-v${version}-windows-x86_64.zip"
          test -f "release-assets/marksharex-v${version}-windows-x86_64.zip.sha256"

          (cd release-assets && sha256sum --check --strict *.sha256)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "MarkShareX $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
