name: Documentation Sync

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: documentation-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Test documentation sync checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Check source and documentation synchronization
        run: python3 scripts/check_doc_sync.py

      - name: Set up Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Run source-of-truth unit contracts
        run: cargo test --lib

      - name: Run Router/OpenAPI production contracts
        run: cargo test --test router_factory
