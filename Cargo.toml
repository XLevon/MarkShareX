[package]
name = "marksharex"
version = "0.4.1"
rust-version = "1.95"
edition = "2021"
description = "轻量自托管 Markdown 博客系统"
license = "MIT"
repository = "https://github.com/XLevon/MarkShareX"

[dependencies]
# Web 框架
axum = { version = "0.7", features = ["multipart", "macros"] }
http = "1"
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-br", "set-header", "limit", "fs"] }

# ORM & 数据库
sea-orm = { version = "1.1", features = [
    "sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros"
] }
sea-orm-migration = "1.1"
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Markdown 解析
comrak = { version = "0.28", features = ["shortcodes"] }

# 模板引擎
tera = "1"

# 全文搜索
tantivy = "0.22"

# 认证 & 安全
jsonwebtoken = "9"
bcrypt = "0.16"
ammonia = "4"

# 文件上传校验
magic = "0.13"

# 缓存
moka = { version = "0.12", features = ["sync"] }

# 配置
config = "0.14"
dotenvy = "0.15"
regex = "1"

# 工具库
base64 = "0.21"
data-url = "0.1.1"
aes-gcm = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 工具
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "0.6", features = ["deflate"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
validator = { version = "0.18", features = ["derive"] }
toml = "0.8"
md-5 = "0.7"

# API 文档
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-scalar = { version = "0.1", features = ["axum"] }

# ASCII 字符画
figlet-rs = "1"

# RSS
rss = "2"

# 定时调度
cron = "0.15"

# 限流
governor = "0.7"
nanoid = "0.5.0"

[dev-dependencies]
axum-test = "16"
tokio-test = "0.4"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3
