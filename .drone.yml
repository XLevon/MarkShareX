kind: pipeline
type: docker
name: deploy

steps:
  - name: build
    image: rust:1.85-slim
    commands:
      - echo "Building MarkShareX..."
      - cp -r /drone/src/* /root/workspace/marksharex/
      - cd /root/workspace/marksharex
      - cargo build --release
      - cp target/release/marksharex /root/workspace/marksharex/marksharex
      - echo "Build complete"

  - name: restart
    image: alpine:3.19
    commands:
      - echo "Restarting marksharex service..."
      - apk add --no-cache util-linux curl
      - nsenter -t 1 -m -u -i -n -p -- systemctl restart marksharex || true
      - echo "Done"

trigger:
  branch:
    - master
    - main
  event:
    - push
    - custom
