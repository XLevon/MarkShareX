# ==============================================================================
# MarkShareX 配置文件
# ==============================================================================
# 说明: 配置项可通过环境变量覆盖，格式: MARKSHAREX_<SECTION>_<KEY>
# 例如: MARKSHAREX_SERVER_PORT=8080 会覆盖 server.port
# ==============================================================================

# ------------------------------ 全局配置 ------------------------------
data_dir = "./data"

# ------------------------------ 服务器配置 ------------------------------
[server]
host = "0.0.0.0"
port = 5023
base_url = "http://0.0.0.0:5023"

# ------------------------------ 数据库配置 ------------------------------
[database]
url = "sqlite://./data/marksharex.db?mode=rwc"
max_connections = 10
min_connections = 1

# ------------------------------ 认证配置 ------------------------------
[auth]
# JWT 签名密钥 — 任意长度字符串，越长越安全。部署时务必修改！
# 生成: openssl rand -base64 64
# ⚠️ 多环境必须一致，否则登录态不互通
jwt_secret = "marksharex-dev-secret-key-2026"

# JWT 过期时间（秒）
jwt_expire_seconds = 3600       # Access Token: 1 小时
refresh_expire_seconds = 604800  # Refresh Token: 7 天

# AES-256-GCM 加密密钥 — 用于加密 AI API Key 等敏感数据
# 格式: 任意字符串，取前 32 字节作为密钥（不足补零，超出截断）
# 生成: openssl rand -base64 32
# ⚠️ 部署时务必生成并固定，切勿修改！修改后已加密的 API Key 将无法解密，需重新输入
# ⚠️ 多环境必须一致，否则加密数据不互通
# 留空则启动时自动生成随机密钥（仅开发环境，生产请固定）
encrypt_key = "change-me-32byte-encrypt-key!!"

# ------------------------------ 存储配置 ------------------------------
[storage]
upload_dir = "./data/uploads"
max_file_size = 20971520   # 20MB
allowed_types = [
    "image/jpeg", "image/png", "image/gif", "image/webp", "image/svg+xml",
    "application/pdf",
    "text/markdown", "text/plain",
    "application/zip", "application/x-zip-compressed",
    "application/gzip", "application/x-tar",
    "application/x-7z-compressed", "application/x-rar-compressed",
    "video/mp4", "video/webm", "video/ogg", "video/quicktime", "video/x-msvideo",
    "audio/mpeg", "audio/mp4", "audio/ogg", "audio/wav", "audio/webm", "audio/aac", "audio/flac",
]

# ------------------------------ AI 搜索配置 ------------------------------
[ai.search]
# 主搜索提供商: tavily | firecrawl
# Tavily 申请: https://app.tavily.com → API Keys → 复制 tvly-xxx
# Firecrawl 申请: https://firecrawl.dev → API Keys → 复制 fc-xxx
provider = "tavily"
api_key = ""

# API 地址（留空用默认）
# Tavily 默认: https://api.tavily.com
# Firecrawl 默认: https://api.firecrawl.dev
api_url = ""

# 降级搜索（主搜索不可用时自动切换）
fallback_provider = "firecrawl"
fallback_api_key = ""

# 终极兜底: DuckDuckGo 免费搜索，无需 API Key
# 国内服务器需通过代理访问（nginx 反代 lite.duckduckgo.com）

# ------------------------------ AI 通用配置 ------------------------------
[ai]
# 工具调用最大轮次（资讯采集等复杂任务建议 12-15）
max_tool_rounds = 8
