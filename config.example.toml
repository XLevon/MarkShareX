# ==============================================================================
# MarkShareX 配置文件
# ==============================================================================
# 说明: 配置项可通过环境变量覆盖，格式: MARKSHAREX_<SECTION>_<KEY>
# 例如: MARKSHAREX_SERVER_PORT=8080 会覆盖 server.port
# ==============================================================================

# ------------------------------ 全局配置 ------------------------------
data_dir = "./data"

# ------------------------------ 服务器配置 ------------------------------
[server]
host = "0.0.0.0"
port = 5023
# 仅支持精确代理 IP（不支持 CIDR）；应用从 X-Forwarded-For 右向左剥离可信代理跳点。
# Nginx 应使用：proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# X-Real-IP 不作为访问控制来源。Nginx 与应用同机时通常配置为 ["127.0.0.1"]；直连部署保持空数组。
trusted_proxies = []

# ------------------------------ 数据库配置 ------------------------------
[database]
url = "sqlite://./data/marksharex.db?mode=rwc"
max_connections = 10
min_connections = 1

# ------------------------------ 认证配置 ------------------------------
[auth]
# JWT 签名密钥 — 任意长度字符串，越长越安全。部署时务必修改！
# 生成: openssl rand -base64 64
jwt_secret = "marksharex-dev-secret-key-2026"

# JWT 过期时间（秒）
jwt_expire_seconds = 3600       # Access Token: 1 小时
refresh_expire_seconds = 604800  # Refresh Token: 7 天

# AES-256-GCM 加密密钥 — 用于加密 AI API Key 等敏感数据
# 格式: 任意字符串，取前 32 字节作为密钥（不足补零，超出截断）
# ⚠️ 部署时务必生成并固定，切勿修改！修改后已加密的 API Key 将无法解密，需重新输入
# 下方为示例值，生产环境请用 `openssl rand -base64 32` 生成替换
encrypt_key = "change-me-32byte-encrypt-key!!"

# ------------------------------ 存储配置 ------------------------------
[storage]
upload_dir = "./data/uploads"
max_file_size = 20971520   # 20MB
allowed_types = [
    "image/jpeg", "image/png", "image/gif", "image/webp",
    "application/pdf",
    "text/markdown", "text/plain",
    "application/zip",
]

# ------------------------------ AI 搜索配置 ------------------------------
[ai.search]
# 搜索提供商: tavily | firecrawl
# Tavily 申请: https://app.tavily.com → API Keys → 复制 tvly-xxx
# Firecrawl 申请: https://firecrawl.dev → API Keys → 复制 fc-xxx
# Tavily 默认: https://api.tavily.com
# Firecrawl 默认: https://api.firecrawl.dev
# DDG 默认: https://lite.duckduckgo.com/lite/

# 主搜索
provider = "tavily"
api_key = ""
# API 地址（留空用默认）
api_url = ""

# 降级搜索（主搜索不可用时自动切换）
fallback_provider = "firecrawl"
fallback_api_key = ""

# 自托管: SearXNG 搜索（聚合多个搜索引擎，配置地址后自动加入降级链）
# 默认: 留空不使用
searxng_url = ""

# 仅允许上述 SearXNG/DDG 配置地址连接的明确内网 IP/CIDR。
# 不影响用户提供的 web_extract URL，也不复用 AI provider allowlist。
allowed_search_networks = []

# 终极兜底: DuckDuckGo 免费搜索，无需 API Key
# 国内服务器需通过代理访问（nginx 反代 lite.duckduckgo.com）
duckduckgo_url = ""

# ------------------------------ AI 通用配置 ------------------------------
[ai]
# 工具调用最大轮次（资讯采集等复杂任务建议 12-15）
max_tool_rounds = 8

# 允许提供商连接的明确内网 IP/CIDR（用于本地 Ollama 等场景）
# 示例: allowed_provider_networks = ["192.168.1.100", "10.0.0.0/24"]
# 留空则拒绝所有内网地址；0.0.0.0 不具有通配语义
allowed_provider_networks = []
