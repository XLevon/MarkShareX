# ==============================================================================
# docker-compose.local.yml — 使用本地预构建 base 镜像
#
# 前提：已执行过 ./scripts/start.sh --base-only（生成本地 base 缓存）
#
# 使用方式：
#   docker compose -f docker-compose.local.yml build   # 仅构建
#   docker compose -f docker-compose.local.yml up -d   # 构建 + 启动
# ==============================================================================

services:
  marksharex:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRONTEND_BASE: marksharex-frontend-base
        BACKEND_BASE: marksharex-backend-base
        RUNTIME_BASE: marksharex-runtime-base
    image: marksharex:latest
    container_name: marksharex
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "5023:5023"
    environment:
      - MARKSHAREX_SERVER_HOST=0.0.0.0
      - MARKSHAREX_SERVER_PORT=5023
      - MARKSHAREX_DATABASE_URL=sqlite:///data/marksharex.db?mode=rwc
      - MARKSHAREX_DATA_DIR=/data
      - MARKSHAREX_STORAGE_UPLOAD_DIR=/data/uploads
    volumes:
      - marksharex_data:/data
    networks:
      - marksharex_net

volumes:
  marksharex_data:
    name: marksharex_data

networks:
  marksharex_net:
    name: marksharex_net
    driver: bridge
