<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MarkShareX 默认社交分享图</title>
  <desc id="desc">MarkShareX 技术文章、编程实践与人工智能默认分享卡片</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#334155" stroke-width="1" opacity=".35"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1100" cy="-20" r="250" fill="#4f46e5" opacity=".12"/>
  <circle cx="1030" cy="560" r="200" fill="#818cf8" opacity=".08"/>

  <g transform="translate(78 72)">
    <rect width="1044" height="486" rx="32" fill="#111c30" stroke="#334155" filter="url(#shadow)"/>
    <rect x="0" y="0" width="10" height="486" rx="5" fill="url(#accent)"/>

    <g transform="translate(58 54)">
      <rect width="58" height="58" rx="15" fill="url(#accent)"/>
      <path d="M17 20h24M17 29h16M17 38h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="78" y="42" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="38" font-weight="750" letter-spacing="-1">Mark</text>
      <text x="174" y="42" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="38" font-weight="750" letter-spacing="-1">Share</text>
      <text x="286" y="42" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="38" font-weight="750" letter-spacing="-1">X</text>
    </g>

    <g transform="translate(58 180)">
      <text x="0" y="0" dominant-baseline="hanging" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="70" font-weight="800" letter-spacing="-2">用 AI 学 AI</text>
      <text x="2" y="105" dominant-baseline="hanging" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="29" font-weight="500">技术文章 · 编程实践 · 人工智能</text>
    </g>

    <g transform="translate(58 404)">
      <circle cx="8" cy="8" r="8" fill="#818cf8"/>
      <text x="28" y="15" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="22">www.xlevon.cn</text>
    </g>

    <g transform="translate(760 115)" opacity=".92">
      <rect width="216" height="244" rx="24" fill="#0f172a" stroke="#334155"/>
      <circle cx="28" cy="28" r="5" fill="#f87171"/>
      <circle cx="46" cy="28" r="5" fill="#fbbf24"/>
      <circle cx="64" cy="28" r="5" fill="#34d399"/>
      <path d="M42 90l-22 22 22 22M174 90l22 22-22 22" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M130 72l-40 82" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
      <rect x="38" y="186" width="140" height="8" rx="4" fill="#334155"/>
      <rect x="38" y="208" width="96" height="8" rx="4" fill="#334155"/>
    </g>
  </g>
